[project]
name = "fifine-k420-studio"
version = "1.0.0"
description = "Управление веб-камерой Fifine K420: изображение, микрофон, запись с настройкой битрейта"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "N"]
ignore = ["SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
